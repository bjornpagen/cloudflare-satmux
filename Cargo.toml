[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
  "crates/satmux-core", "crates/satmux-carrier", "crates/satmuxd", "crates/satmux-tun",
  "crates/satmux-utun", "crates/satmux-key", "crates/satmux-ask", "crates/satmux-probe",
  "crates/satmux-relay-native",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "0BSD"
publish = false

[workspace.dependencies]
satmux-core = { path = "crates/satmux-core" }
satmux-carrier = { path = "crates/satmux-carrier" }
satmux-tun = { path = "crates/satmux-tun" }
tokio = { version = "=1.54.1", default-features = false }
futures = "0.3"
bytes = "1"
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "=0.14.1"
socket2 = { version = "=0.6.5", features = ["all"] }
httparse = "=1.10.1"
sha2 = "=0.11.1"
subtle = "=2.6.1"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
proptest = "=1.12.0"
turmoil = "=0.7.2"
libc = "0.2"
getrandom = "0.4"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
satmux-relay-logic = { path = "crates/satmux-relay-logic" }
worker = "=0.8.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
nix = { version = "0.30", default-features = false, features = ["net"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
